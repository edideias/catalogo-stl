name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'app/renderer/**', 'app/vendor/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar web e projeto Android
        working-directory: mobile
        run: |
          set -o pipefail
          {
            npm install --legacy-peer-deps
            node build-www.mjs
            npx cap add android
            mkdir -p android/app/src/main/java/com/edideias/catalogostl
            cp overlay/SafPlugin.java overlay/MainActivity.java android/app/src/main/java/com/edideias/catalogostl/
            npx cap sync android
          } 2>&1 | tee ../prepare.log

      - name: Assinatura fixa (permite atualizar o app sem desinstalar)
        run: |
          mkdir -p ~/.android
          cp mobile/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: mobile/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../../build.log

      - name: Nomear APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Catalogo-STL.apk

      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Catálogo STL para Android
          make_latest: false
          files: Catalogo-STL.apk

      - name: Publicar log (diagnóstico)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-log
          name: Log do build Android
          make_latest: false
          files: |
            prepare.log
            build.log
